[global]
developmentMode = false

[server]
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
fileWatcherType = "none"
baseUrlPath = ""

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[secrets]
files = []

[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#020617"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
